<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayori — Papelaria & Estilo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf8f5;
            color: #4a4a4a;
            text-align: center;
        }
        header {
            background-color: #eed6d3;
            padding: 40px 20px;
        }
        h1 {
            color: #5c3d46;
            font-size: 2.5em;
            margin: 0;
        }
        p.sub {
            font-size: 1.1em;
            color: #7d5a65;
        }
        .container {
            padding: 30px 20px;
            max-width: 800px;
            margin: auto;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn {
            display: inline-block;
            background-color: #b5838d;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zayori</h1>
        <p class="sub">Papelaria, Stickers & Criatividade</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bem-vindo à Zayori!</h2>
            <p>Em breve, novidades incríveis de papelaria personalizada, autocolantes e muito mais para si.</p>
            <a href="#" class="btn">Ver Catálogo</a>
        </div>
    </div>

</body>
</html>
