<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayori</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf8f5;
            color: #4a4a4a;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #eed6d3;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        h1 {
            color: #b5838d;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn {
            display: inline-block;
            background-color: #b5838d;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zayori</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bem-vindo à Zayori!</h2>
            <p>Em breve, novidades incríveis, criações exclusivas e muito mais para você.</p>
            <a href="#" class="btn">Ver Catálogo</a>
        </div>
    </div>

</body>
</html>
